name: Deploy FurMatch Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://app-adopcion-backend-dev.azurewebsites.net/api"
          NEXT_PUBLIC_APP_URL: "https://app-adopcion-frontend-dev.azurewebsites.net"

      # --- PASO CRÍTICO: ORGANIZAR LA CARPETA DE DESPLIEGUE ---
      - name: Prepare Production Bundle
        run: |
          mkdir deploy_package
          # 1. Copiamos el servidor standalone y sus módulos internos
          cp -r .next/standalone/* deploy_package/
          # 2. Copiamos los archivos estáticos y públicos a la ruta que Next.js espera
          cp -r public deploy_package/
          mkdir -p deploy_package/.next/static
          cp -r .next/static/* deploy_package/.next/static/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: deploy_package # Subimos solo la carpeta limpia

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-adopcion-frontend-dev'
          package: .