name: Deploy FurMatch Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://app-adopcion-backend-dev.azurewebsites.net/api"
          NEXT_PUBLIC_APP_URL: "https://app-adopcion-frontend-dev.azurewebsites.net"

      - name: Prepare Production Bundle
        run: |
          # 1. Creamos una carpeta de despliegue que NO sea oculta
          mkdir -p deploy_package
          
          # 2. Copiamos el contenido de standalone (incluyendo el server.js)
          cp -r .next/standalone/. deploy_package/
          
          # 3. Copiamos public y static (Next standalone no los trae por defecto)
          cp -r public deploy_package/
          
          # 4. PASO CLAVE: Forzamos la copia del "cerebro" (.next) a la carpeta de despliegue
          # Usamos '.' para asegurar que se copie TODO lo que hay dentro
          mkdir -p deploy_package/.next
          cp -r .next/static deploy_package/.next/
          cp -r .next/standalone/.next/. deploy_package/.next/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: deploy_package/  # Subimos la carpeta completa y organizada

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-adopcion-frontend-dev'
          package: .