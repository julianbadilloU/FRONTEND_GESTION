name: Deploy FurMatch Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://app-adopcion-backend-dev.azurewebsites.net/api"
          NEXT_PUBLIC_APP_URL: "https://app-adopcion-frontend-dev.azurewebsites.net"

      - name: Prepare Production Bundle
        run: |
          # 1. Creamos la carpeta de despliegue
          mkdir -p deploy_package
          
          # 2. Copiamos el contenido de standalone (server.js, node_modules y el .next interno)
          # Usamos cp -a para preservar atributos y carpetas ocultas
          cp -a .next/standalone/. deploy_package/
          
          # 3. Copiamos public y static (necesarios para el diseño)
          cp -r public deploy_package/
          mkdir -p deploy_package/.next/static
          cp -r .next/static/. deploy_package/.next/static/

          # 4. OPCIONAL: Borramos el package.json del paquete final
          # Esto evita que Azure intente instalar cosas por su cuenta
          rm deploy_package/package.json || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: deploy_package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-adopcion-frontend-dev'
          package: .